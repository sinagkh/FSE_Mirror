  prompt:
    templates:
    - a {word_1} {noun_1} and a {word_2} {noun_2}
    - a {word_1} {noun_1} next to a {word_2} {noun_2}
    - the {noun_1} is {word_1} and the {noun_2} is {word_2}
    aggregation: mean_normalized_embedding
