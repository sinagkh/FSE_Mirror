schema_version: 1
id: routing/context-and-preference-v3
bug_type: leakage
semantic_intent: Each color word should refer to its designated object slot, without
  inheriting the other slot's color.
operational_measurement: All 16 conditional image-factor x word-factor second differences.
  Eight desired binding floors, eight absolute cross-effect bounds and eight relative
  bounds. Each relative cross effect is referenced to the same image factor's own-word
  binding with the other object's caption color matching its image color. Complete
  conformance certifies differential response under K>tau, not absolute exchange rankings.
  Also bounds the mean first-order exchange-caption preference; K-tau-beta>0 suffices
  for two strict exchange decisions, not every caption decision.
evidence_status: Post-specified diagnostic extension; frozen calibration; not a tested
  repair objective
scorer_output: cosine
